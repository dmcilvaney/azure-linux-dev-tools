name: "Release"

# Runs on every push to main. Tags the release when CHANGELOG.md carries a new
# version (via the idempotent `mage release`), and pushes the tag. Normal merges
# are a no-op because the changelog's top version is already tagged. See
# docs/developer/how-to/releasing.md.
on:
  push:
    branches: [main, damcilva/changelog_workflows_testing] # TESTING ONLY: drop the testing branch before merging.

# Don't run two releases at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: "Tag release"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the release tag.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need full history and tags to detect existing releases and tag HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Get go tools
        uses: ./.github/getgotools

      - name: Create release tag from changelog
        run: |
          # Annotated tags (git tag -a) need a committer identity, which the runner lacks.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mage release

      - name: Push release tag if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## \[\([0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ -z "$version" ]; then
            echo "no '## [X.Y.Z]' heading found in CHANGELOG.md" >&2
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag \`${tag}\` already on remote; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/${tag}"
            echo "Released \`${tag}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
